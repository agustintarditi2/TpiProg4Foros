name: Automated tests

on:
  push:
    branches: [Tests]
  pull_request:
    branches: [develop, Tests]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore TpiProg4Foros.slnx
      - name: Build
        run: dotnet build TpiProg4Foros.slnx --no-restore --configuration Release
      - name: Run unit tests
        run: dotnet test tests/TpiProg4Foros.Tests/TpiProg4Foros.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=tests.trx" --collect:"XPlat Code Coverage"
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: |
            tests/**/TestResults/**
          if-no-files-found: ignore
